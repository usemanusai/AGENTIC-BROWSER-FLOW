[project]
name = "agentic_browser_flow"
version = "0.1.0"
description = "agentic_browser_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.11,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_browser_flow"]

[tool.crewai]
type = "flow"
definition = "src/agentic_browser_flow/flow.json"
project_id = "14ff8aaa-7161-495f-810a-370d4f2c7b51"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
